networks:
  job-portal-net:
    driver: bridge

services:

  # ============================================================
  # DATABASES  (one container per service)
  # ============================================================

  userdb:
    image: postgres:16
    container_name: job-portal-userdb
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: job_portal_user
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - job-portal-net


  companydb:
    image: postgres:16
    container_name: job-portal-companydb
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: job_portal_company
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - job-portal-net

  jobdb:
    image: postgres:16
    container_name: job-portal-jobdb
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: job_portal_job
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - job-portal-net

  applicationdb:
    image: postgres:16
    container_name: job-portal-applicationdb
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "5436:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: job_portal_application
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - job-portal-net

  preferencedb:
    image: postgres:16
    container_name: job-portal-preferencedb
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "5439:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: job_portal_preference
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - job-portal-net


  resumedb:
    image: postgres:16
    container_name: job-portal-resumedb
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "5440:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: job_portal_resume
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - job-portal-net


  # ============================================================
  # CACHE
  # ============================================================

  redis:
    image: redis:7-alpine
    container_name: job-portal-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - job-portal-net

  # ============================================================
  # SPRING CLOUD
  # ============================================================

  discovery:
    image: andyy02/job-portal-service-registry:latest
    container_name: job-portal-discovery
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 8
    networks:
      - job-portal-net


  config-server:
    image: andyy02/job-portal-config-server:latest
    container_name: job-portal-config-server
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "8888:8888"
    depends_on:
      discovery:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka/
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8888/actuator/health" ]
      interval: 15s
      timeout: 10s
      retries: 8
    networks:
      - job-portal-net

  gateway:
    image: andyy02/job-portal-api-gateway:latest
    container_name: job-portal-gateway
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "5000:5000"
    depends_on:
      discovery:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka/
    networks:
      - job-portal-net


  # ============================================================
  # Kafka SERVICES
  # ============================================================
  kafka:
    image: apache/kafka:4.3.1
    container_name: job-portal-kafka-dev
    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    networks:
      - job-portal-net


  # ============================================================
  # APPLICATION SERVICES
  # ============================================================

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: job-portal-mailhog
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    networks:
      - job-portal-net

  user-service:
    image: andyy02/job-portal-user-service:latest
    container_name: job-portal-user-service
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "5001:5001"
    depends_on:
      discovery:
        condition: service_healthy
      userdb:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:postgresql://userdb:5432/job_portal_user
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka/
    networks:
      - job-portal-net


  company-service:
    image: andyy02/job-portal-company-service:latest
    container_name: job-portal-company-service
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "5002:5002"
    depends_on:
      discovery:
        condition: service_healthy
      companydb:
        condition: service_healthy
      config-server:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:postgresql://companydb:5432/job_portal_company
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka/
    networks:
      - job-portal-net

  job-service:
    image: andyy02/job-portal-job-service:latest
    container_name: job-portal-job-service
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "5003:5003"
    depends_on:
      discovery:
        condition: service_healthy
      jobdb:
        condition: service_healthy
      config-server:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:postgresql://jobdb:5432/job_portal_job
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka/
    networks:
      - job-portal-net

  application-service:
    image: andyy02/job-portal-application-service:latest
    container_name: job-portal-application-service
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "5005:5005"
    depends_on:
      discovery:
        condition: service_healthy
      applicationdb:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATASOURCE_URL: jdbc:postgresql://applicationdb:5432/job_portal_application
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka/
    networks:
      - job-portal-net

  preference-service:
    image: andyy02/job-portal-preference-service:latest
    container_name: job-portal-preference-service
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "5006:5006"
    depends_on:
      discovery:
        condition: service_healthy
      preferencedb:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:postgresql://preferencedb:5432/job_portal_preference
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka/
    networks:
      - job-portal-net


  resume-service:
    image: andyy02/job-portal-resume-service:latest
    container_name: job-portal-resume-service
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "5004:5004"
    depends_on:
      discovery:
        condition: service_healthy
      resumedb:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:postgresql://resumedb:5432/job_portal_resume
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka/
    networks:
      - job-portal-net

  ai-service:
    image: andyy02/job-portal-ai-service:latest
    container_name: job-portal-ai-service
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "6000:6000"
    depends_on:
      discovery:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka/
    networks:
      - job-portal-net

  notification-service:
    image: andyy02/job-portal-notification-service:latest
    container_name: job-portal-notification-service
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "5011:5011"
    depends_on:
      discovery:
        condition: service_healthy
      config-server:
        condition: service_healthy
      mailhog:
        condition: service_started
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka/
      SPRING_MAIL_HOST: mailhog
      SPRING_MAIL_PORT: 1025
      SPRING_MAIL_USERNAME: no-reply@job-portal.local
      SPRING_MAIL_PASSWORD: ""
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "false"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "false"
      APP_MAIL_FROM: no-reply@job-portal.local
    networks:
      - job-portal-net
